<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Student Registration</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
  <h1>Student Registration</h1>
  <div class="card">
    <form id="regForm">
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" placeholder="Enter full name" required />

      <label for="studentId">Student ID</label>
      <input id="studentId" name="studentId" type="text" placeholder="Enter student ID" required />

      <label for="rollNumber">Roll Number</label>
      <input id="rollNumber" name="rollNumber" type="text" placeholder="Enter roll number" required />

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">Loading courses...</option>
      </select>

      <button type="submit">Register</button>
      <div id="message" class="hidden small"></div>
    </form>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
